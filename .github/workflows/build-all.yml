name: Build EECC Ecosystem

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ========================================================
  # 1. BUILD EECC WEB PORTAL (Next.js)
  # ========================================================
  build-web-portal:
    name: Build Web Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/web_portal/package.json'

      - name: Install dependencies
        working-directory: apps/web_portal
        run: npm install

      - name: Build Web Portal
        working-directory: apps/web_portal
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://rwojdiomftillhsamjal.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_GjqG64b82uXaDQzGJmo3Aw_pIcpjxKb' }}
        run: npm run build

  # ========================================================
  # 2. BUILD EECC STUDIO (React / Vite)
  # ========================================================
  build-studio:
    name: Build EECC Studio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/studio/package.json'

      - name: Install dependencies
        working-directory: apps/studio
        run: npm install

      - name: Build Studio
        working-directory: apps/studio
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://rwojdiomftillhsamjal.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_GjqG64b82uXaDQzGJmo3Aw_pIcpjxKb' }}
        run: npm run build

      - name: Upload Studio Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eecc-studio-dist
          path: apps/studio/dist/

  # ========================================================
  # 3. BUILD EECC TV MOBILE (Flutter Android APK)
  # ========================================================
  build-tv-apk:
    name: Build EECC TV APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Prepare Clean Android Platform
        working-directory: apps/tv_mobile
        run: |
          mkdir -p /tmp/tv_res
          if [ -d "android/app/src/main/res" ]; then
            cp -r android/app/src/main/res/* /tmp/tv_res/ || true
          fi
          rm -rf android
          flutter create --platforms=android --org cd.eecc .
          if [ -d "/tmp/tv_res" ]; then
            cp -r /tmp/tv_res/* android/app/src/main/res/ || true
          fi
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' android/app/src/main/AndroidManifest.xml
          cat << 'EOF' >> android/build.gradle

allprojects {
    ext.compileSdkVersion = 34
    ext.minSdkVersion = 21
    ext.targetSdkVersion = 34
    ext.flutter = [
        compileSdkVersion: 34,
        minSdkVersion: 21,
        targetSdkVersion: 34
    ]
}

subprojects {
    project.evaluationDependsOn(':app')
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
                compileSdkVersion 34
            }
        }
    }
}
EOF
          flutter pub get

      - name: Build TV Release APK
        working-directory: apps/tv_mobile
        run: flutter build apk --release

      - name: Upload EECC TV APK
        uses: actions/upload-artifact@v4
        with:
          name: EECC_TV_Release_APK
          path: apps/tv_mobile/build/app/outputs/flutter-apk/app-release.apk

  # ========================================================
  # 4. BUILD EECC CAMERA MOBILE (Flutter Android APK)
  # ========================================================
  build-camera-apk:
    name: Build EECC Caméra APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Prepare Clean Android Platform
        working-directory: apps/camera_mobile
        run: |
          mkdir -p /tmp/cam_res
          if [ -d "android/app/src/main/res" ]; then
            cp -r android/app/src/main/res/* /tmp/cam_res/ || true
          fi
          rm -rf android
          flutter create --platforms=android --org cd.eecc .
          if [ -d "/tmp/cam_res" ]; then
            cp -r /tmp/cam_res/* android/app/src/main/res/ || true
          fi
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"\/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"\/>' android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Build Caméra Release APK
        working-directory: apps/camera_mobile
        run: flutter build apk --release

      - name: Upload EECC Caméra APK
        uses: actions/upload-artifact@v4
        with:
          name: EECC_Camera_Release_APK
          path: apps/camera_mobile/build/app/outputs/flutter-apk/app-release.apk
