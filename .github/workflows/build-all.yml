name: Build & Release EECC Ecosystem

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publier automatiquement une Release GitHub avec les installateurs et APKs'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ========================================================
  # 1. BUILD EECC STUDIO (Windows Natif C# / C++ + Installateur)
  # ========================================================
  build-studio-windows:
    name: Build EECC Studio (Installateur Windows C# / C++)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Test LAN camera pairing
        working-directory: apps/studio_native
        run: dotnet test tests/EeccStudio.Core.Tests/EeccStudio.Core.Tests.csproj -c Release --nologo

      - name: Publish EECC Studio Native (.NET 8 Win-x64 Self-Contained)
        working-directory: apps/studio_native
        run: |
          dotnet publish src/EeccStudio.App/EeccStudio.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/win-x64

      - name: Compile Windows Installer (.exe) with Inno Setup
        working-directory: apps/studio_native
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/EeccStudio_Setup.iss

      - name: Install silently and launch the installed EECC Studio
        working-directory: apps/studio_native
        run: |
          $ErrorActionPreference = "Stop"
          $dest = Join-Path $env:USERPROFILE "EECCStudioSmoke"
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          $setup = (Resolve-Path "dist_installer\EECC_Studio_Setup_x64.exe").Path
          $install = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dest","/MERGETASKS=!desktopicon,!firewall" -Wait -PassThru
          Write-Host "Installer exit code: $($install.ExitCode)"
          if ($install.ExitCode -ne 0) { throw "Silent install failed with exit $($install.ExitCode)" }

          $exe = Join-Path $dest "EeccStudio.exe"
          if (-not (Test-Path $exe)) { throw "Installed executable missing: $exe" }
          foreach ($required in @("EeccStudio.dll","coreclr.dll","hostfxr.dll","wpfgfx_cor3.dll")) {
            $path = Join-Path $dest $required
            if (-not (Test-Path $path)) { throw "Installed package is missing $required" }
          }

          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon -or $icon.Width -lt 16) { throw "Installed EeccStudio.exe has no usable icon" }
          Write-Host "Embedded icon: $($icon.Width)x$($icon.Height)"

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exe
          $psi.WorkingDirectory = $dest
          $psi.UseShellExecute = $false
          $psi.Environment["EECC_STUDIO_SMOKE"] = "1"
          $proc = [System.Diagnostics.Process]::Start($psi)
          if ($null -eq $proc) { throw "Failed to start installed EeccStudio.exe" }

          $ready = Join-Path $dest "startup.ready"
          $log = Join-Path $dest "startup.log"
          $deadline = (Get-Date).AddSeconds(25)
          do {
            $proc.Refresh()
            if ($proc.HasExited -or (Test-Path $ready)) { break }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)

          if (Test-Path $log) { Write-Host "---- startup.log ----"; Get-Content $log -Raw; Write-Host "---- end log ----" }
          if ($proc.HasExited) {
            Write-Host "Process exit code: $($proc.ExitCode)"
            throw "Installed EECC Studio exited before the window was ready"
          }
          if (-not (Test-Path $ready)) { throw "Installed EECC Studio stayed running but did not open its window" }
          $proc.Refresh()
          Write-Host "MainWindowHandle=$($proc.MainWindowHandle) ready=yes"
          Stop-Process -Id $proc.Id -Force
          Write-Host "Installed EECC Studio started and opened its window"

      - name: Create Portable Zip Package
        working-directory: apps/studio_native
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath dist_installer/EECC_Studio_Portable_win-x64.zip -Force

      - name: Upload Windows Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: EECC_Studio_Setup_x64
          path: apps/studio_native/dist_installer/EECC_Studio_Setup_x64.exe

      - name: Upload Windows Portable (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: EECC_Studio_Portable_x64
          path: apps/studio_native/dist_installer/EECC_Studio_Portable_win-x64.zip

  # ========================================================
  # 2. BUILD EECC TV MOBILE (Flutter Android APK)
  # ========================================================
  build-tv-apk:
    name: Build EECC TV (Mobile APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Flutter Pub Get
        working-directory: apps/tv_mobile
        run: flutter pub get

      - name: Patch Cached Gradle Plugins
        run: |
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/flutter\.compileSdkVersion/35/g; s/flutter\.minSdkVersion/21/g; s/flutter\.targetSdkVersion/35/g' {} + || true

      - name: Build Release APK
        working-directory: apps/tv_mobile
        run: flutter build apk --release

      - name: Prepare Artifact
        working-directory: apps/tv_mobile
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/EECC_TV_Release.apk

      - name: Upload EECC TV APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EECC_TV_Release_APK
          path: apps/tv_mobile/build/app/outputs/flutter-apk/EECC_TV_Release.apk

  # ========================================================
  # 3. BUILD EECC CAMÉRA MOBILE (Flutter Android APK)
  # ========================================================
  build-camera-apk:
    name: Build EECC Caméra (Mobile APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Flutter Pub Get
        working-directory: apps/camera_mobile
        run: flutter pub get

      - name: Patch Cached Gradle Plugins
        run: |
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/flutter\.compileSdkVersion/35/g; s/flutter\.minSdkVersion/21/g; s/flutter\.targetSdkVersion/35/g' {} + || true

      - name: Flutter test
        working-directory: apps/camera_mobile
        run: flutter test

      - name: Build Release APK
        working-directory: apps/camera_mobile
        run: flutter build apk --release

      - name: Prepare Artifact
        working-directory: apps/camera_mobile
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/EECC_Camera_Release.apk

      - name: Upload EECC Caméra APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EECC_Camera_Release_APK
          path: apps/camera_mobile/build/app/outputs/flutter-apk/EECC_Camera_Release.apk

  # ========================================================
  # 4. BUILD EECC WEB PORTAL (Next.js)
  # ========================================================
  build-web-portal:
    name: Build Web Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/web_portal/package.json'

      - name: Install dependencies
        working-directory: apps/web_portal
        run: npm install

      - name: Build Next.js Web Portal
        working-directory: apps/web_portal
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://rwojdiomftillhsamjal.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_GjqG64b82uXaDQzGJmo3Aw_pIcpjxKb' }}
        run: npm run build

      - name: Package Web Portal build
        run: tar -czf web-portal-next.tar.gz --exclude=.next/cache -C apps/web_portal .next

      - name: Upload Web Portal build
        uses: actions/upload-artifact@v4
        with:
          name: EECC_Web_Portal
          path: web-portal-next.tar.gz
          if-no-files-found: error

  # ========================================================
  # 5. GITHUB RELEASE AUTOMATIQUE (Tous les binaires réunis)
  # ========================================================
  create-release:
    name: Publier la Release GitHub
    needs: [build-studio-windows, build-tv-apk, build-camera-apk, build-web-portal]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Studio Installer Artifact
        uses: actions/download-artifact@v4
        with:
          name: EECC_Studio_Setup_x64
          path: release_assets/

      - name: Download Studio Portable Artifact
        uses: actions/download-artifact@v4
        with:
          name: EECC_Studio_Portable_x64
          path: release_assets/

      - name: Download TV APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: EECC_TV_Release_APK
          path: release_assets/

      - name: Download Camera APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: EECC_Camera_Release_APK
          path: release_assets/

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: "EECC Écosystème ${{ github.ref_name || 'v1.0.0' }} — Suite Officielle Broadcast & Mobile"
          body: |
            ## 🌟 EECC Écosystème Numérique — Version Officielle

            Bienvenue sur la version officielle de la suite numérique de l'Église Évangélique les Cohéritiers du Christ (EECC).

            ### 📦 Téléchargements disponibles :

            #### 🖥️ Régie Windows Broadcast (C# / C++ Natif)
            * **[EECC_Studio_Setup_x64.exe](EECC_Studio_Setup_x64.exe)** : Installateur automatique pour Windows 10 et 11 (64-bit).
            * **[EECC_Studio_Portable_win-x64.zip](EECC_Studio_Portable_win-x64.zip)** : Version portable sans installation.

            #### 📱 Applications Mobiles (Android)
            * **[EECC_TV_Release.apk](EECC_TV_Release.apk)** : Application mobile pour suivre les cultes en direct, les replays et la Bible.
            * **[EECC_Camera_Release.apk](EECC_Camera_Release.apk)** : Application caméra sans fil pour transformer vos smartphones en caméras broadcast avec feux Tally.

            ---
            *Conçu avec des technologies natives et une charte graphique professionnelle 0% dégradé.*
          files: release_assets/*
