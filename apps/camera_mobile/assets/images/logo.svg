<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- EECC CAMÉRA - INSPIRÉ DE EECC & CAMÉRA -->
  <!-- APLATS PURS SOLIDES - 2 COULEURS : BLEU INSTITUTIONNEL EECC & BLANC PUR -->
  <rect width="512" height="512" rx="100" fill="#1E3A8A" />
  
  <g transform="translate(66, 120)">
    <!-- Poignee de transport superieure de camera broadcast -->
    <path d="M 60,30 L 180,30 L 190,54 L 50,54 Z" fill="#FFFFFF" opacity="0.35" />

    <!-- Corps principal de la Camera (Rectangle solide blanc) -->
    <rect x="30" y="54" width="220" height="170" rx="28" fill="#FFFFFF" />

    <!-- Objectif biseaute de la Camera (Trapeze solide blanc a droite) -->
    <polygon points="264,84 350,44 350,234 264,194" fill="#FFFFFF" />

    <!-- Croix EECC au coeur de la Camera (Decoupee en Bleu EECC) -->
    <!-- Fut vertical -->
    <rect x="126" y="84" width="28" height="110" rx="6" fill="#1E3A8A" />
    <!-- Traverse horizontale -->
    <rect x="90" y="112" width="100" height="28" rx="6" fill="#1E3A8A" />
    <!-- Coeur lumineux de la croix -->
    <circle cx="140" cy="126" r="6" fill="#FFFFFF" />
  </g>

  <!-- Typogramme sobre EECC CAMÉRA -->
  <text x="256" y="390" font-family="'Plus Jakarta Sans', Montserrat, Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">EECC CAMÉRA</text>
  <text x="256" y="420" font-family="'Inter', Arial, sans-serif" font-size="14" font-weight="600" fill="#93C5FD" text-anchor="middle" letter-spacing="3">FLUX VIDÉO SANS FIL</text>
</svg>
