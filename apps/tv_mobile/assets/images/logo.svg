<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- EECC TV - INSPIRÉ D'EMCI TV (BADGE 'TV' PLUS PROCHE & PLUS GRAND) -->
  <!-- APLATS PURS SOLIDES - 0% DÉGRADÉ -->
  <rect width="512" height="512" rx="100" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" />
  
  <!-- GROUPE CENTRAL OPTIQUEMENT ÉQUILIBRÉ -->
  <!-- 'eecc' : x=48 à x=304 (largeur 256) | Badge 'tv' : x=318 à x=456 (largeur 138, hauteur 108) -->
  
  <!-- Lettrage minuscules gras 'eecc' en Bleu Nuit EMCI (#0B1B3D) -->
  <g fill="#0B1B3D">
    <text x="48" y="274" font-family="'Plus Jakarta Sans', 'Segoe UI', Montserrat, Arial, sans-serif" font-size="104" font-weight="900" textLength="256" lengthAdjust="spacing">eecc</text>
  </g>
  
  <!-- Cartouche rouge broadcast 'tv' (#DC2626) : PLUS GRAND (138x108) et PLUS PROCHE (écart franc de 14px) -->
  <rect x="318" y="178" width="138" height="108" rx="26" fill="#DC2626" />
  <text x="387" y="258" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="70" font-weight="900" fill="#FFFFFF" text-anchor="middle">tv</text>
  
  <!-- Ligne broadcast rouge dynamique centrée sous l'ensemble (de x=48 à x=462) -->
  <rect x="48" y="312" width="398" height="8" rx="4" fill="#DC2626" />
  <circle cx="456" cy="316" r="6" fill="#0B1B3D" />

  <!-- Sous-titre officiel centré sous la ligne broadcast -->
  <text x="256" y="362" font-family="'Inter', Arial, sans-serif" font-size="16" font-weight="800" fill="#64748B" text-anchor="middle" letter-spacing="7">LE CANAL DE L'ÉGLISE</text>
</svg>
