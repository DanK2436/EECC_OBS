allprojects {
    ext.compileSdkVersion = 34
    ext.minSdkVersion = 21
    ext.targetSdkVersion = 34
    ext.flutter = [
        compileSdkVersion: 34,
        minSdkVersion: 21,
        targetSdkVersion: 34
    ]
}

subprojects {
    project.evaluationDependsOn(':app')
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
                compileSdkVersion 34
            }
        }
    }
}
