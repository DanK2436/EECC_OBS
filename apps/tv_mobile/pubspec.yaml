name: eecc_tv
description: "Application mobile officielle EECC TV — Cultes en direct, Replays et Médias"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  video_player: ^2.8.6
  chewie: ^1.8.1
  just_audio: ^0.9.38
  url_launcher: ^6.3.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/bible/
