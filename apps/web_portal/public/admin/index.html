<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Console Admin EECC</title>
  <link rel="stylesheet" href="assets/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">
          <div class="logo-mark">E</div>
          <span class="logo-text">EECC Studio</span>
        </div>
        <h1 class="login-title">Connexion à la console d'administration</h1>
        <p class="login-subtitle">Accès réservé aux administrateurs de l'église EECC</p>
      </div>

      <div id="login-error" class="alert alert-error" style="display:none;"></div>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label class="form-label" for="email">E-mail</label>
          <input type="email" id="email" name="email" class="form-input" required placeholder="admin@eecc-eglise.org" autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Mot de passe</label>
          <input type="password" id="password" name="password" class="form-input" required placeholder="••••••••" autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="login-btn">
          Se connecter
        </button>
      </form>

      <div class="login-footer">
        <p class="footer-text">
          Pas de compte ? <a href="#" onclick="alert('Contactez l\'administrateur système pour créer un accès.')">Demander un accès</a>
        </p>
        <p class="footer-text"><a href="../index.html">Retour au site public</a></p>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
